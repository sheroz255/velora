<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Velora — Curated finds from Amazon</title>
  <meta name="description" content="Hand-picked products with honest ratings. Shop through Amazon affiliate links." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="#" class="logo" id="logo-link">
        <span class="logo-mark">V</span>
        <span class="logo-text">Velora</span>
      </a>
      <nav class="nav-desktop" id="nav-cats"></nav>
      <div class="header-actions">
        <div class="search-wrap">
          <input type="search" id="search-input" placeholder="Search products…" autocomplete="off" />
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </div>
      </div>
    </div>
  </header>

  <main class="container" id="app">
    <!-- Views injected by app.js -->
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>
        <div class="logo footer-logo">
          <span class="logo-mark">V</span>
          <span class="logo-text">Velora</span>
        </div>
        <p class="footer-tagline">Curated products. Transparent ratings. Amazon checkout.</p>
      </div>
      <p class="footer-note">As an Amazon Associate we earn from qualifying purchases. Prices shown are approximate and may change on Amazon.</p>
    </div>
  </footer>

  <script src="products.js"></script>
  <script src="app.js"></script>
</body>
</html>
